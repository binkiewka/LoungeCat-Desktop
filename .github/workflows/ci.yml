name: Native source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Qt and native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libqt6svg6-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DLOUNGECAT_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test synthetic local fixtures
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build/ci --output-on-failure
